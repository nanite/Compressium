plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Parse minecraft_version to create mod_version
// 26.1 → 26.1.0.{build}, 26.1.1 → 26.1.1.{build}
def mcVersionParts = minecraft_version.tokenize('.')
def modVersionBase = mcVersionParts.size() == 2 ? "${mcVersionParts[0]}.${mcVersionParts[1]}.0" : minecraft_version

// Use passed buildNumber or default to local
def buildNumber = project.hasProperty('buildNumber') ? project.buildNumber : 'local'

version = "${modVersionBase}.${buildNumber}"

group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // Add additional repositories here if needed.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // No additional dependencies beyond NeoForge
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

def ENV = System.getenv()

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        if (ENV.NANITE_DEPLOY) {
            maven {
                url "https://maven.nanite.dev/releases"
                credentials {
                    username = "nanite"
                    password = "${ENV.NANITE_DEPLOY}"
                }
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishMods {
    file = jar.archiveFile
    type = STABLE
    modLoaders.add("neoforge")

    github {
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        repository = "nanite/Compressium"
        commitish = project.hasProperty('defaultBranch') ? project.defaultBranch : "dev/26.2"
        tagName = "v26.2"
        changelog = file("CHANGELOG.md").text
    }

    curseforge {
        projectId = "342929"
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        minecraftVersions.add("26.2")

        javaVersions.add(JavaVersion.VERSION_25)
        clientRequired = true
        serverRequired = true
        projectSlug = "compressium"

        changelog = file("CHANGELOG.md").text
        changelogType = "markdown"
    }
}
